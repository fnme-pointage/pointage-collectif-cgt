<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulation — Administration nationale</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17304d;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1220px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;background:white;border:1px solid #dfe8f3;border-radius:19px;padding:19px 24px;margin-bottom:18px;gap:16px}.brand{font-size:12px;letter-spacing:1.4px;color:#607995;font-weight:800}.top h1{font-size:23px;margin:5px 0 0}.pill{background:#eaf3ff;color:#12569c;border-radius:30px;padding:9px 13px;font-size:12px;font-weight:750}.notice{padding:12px 18px;border:1px solid #e8d2a0;background:#fff8e8;border-radius:13px;font-size:13px;margin-bottom:20px}.layout{display:grid;grid-template-columns:238px minmax(0,1fr);gap:20px}.side,.panel{background:white;border:1px solid #dfe8f3;border-radius:18px;padding:19px}.side{align-self:start}.side h3{font-size:12px;color:#8294a7;text-transform:uppercase;letter-spacing:1px;margin:5px 8px 14px}button{font:inherit;cursor:pointer}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:11px;padding:13px 12px;color:#405772;margin:4px 0;font-weight:650}.nav.active,.nav:hover{background:#e8f2fe;color:#145b9f}.panel{min-height:490px}.eyebrow{font-size:12px;color:#7289a2;text-transform:uppercase;letter-spacing:1px;font-weight:750}.panel h2{font-size:24px;margin:8px 0}.sub{color:#6d8097;font-size:14px;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:22px 0}.tile{border:1px solid #dae6f1;background:#fcfdff;border-radius:15px;padding:21px;text-align:left;min-height:118px}.tile:hover{border-color:#84b2e4;background:#f4f9ff}.tile b{display:block;font-size:17px;margin:8px 0}.tile small{color:#68819e}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:21px 0}input,select{min-width:0;max-width:100%;border:1px solid #cfdbeb;border-radius:10px;padding:12px 13px;background:white;color:#17304d;font-size:14px;font-weight:400}.toolbar input{flex:1;min-width:180px}.item{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid #e0e8f1;border-radius:12px;margin:9px 0}.item .grow{flex:1;min-width:0}.item strong{display:block;margin-bottom:4px}.item small{color:#7689a1}.primary{background:#1766b5;color:white;border:0;padding:11px 16px;border-radius:10px;font-weight:700}.secondary{background:white;color:#175e9f;border:1px solid #cbddeb;padding:10px 14px;border-radius:10px;font-weight:700}.crumb{font-size:13px;color:#657c96;margin-bottom:19px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:13px;border-bottom:1px solid #e9eef5;text-align:left}th{font-size:12px;color:#71849b}td:first-child{font-weight:750}.chip{display:inline-block;background:#e9f5ee;color:#207148;font-size:12px;padding:6px 9px;border-radius:20px}.hidden{display:none!important}dialog{border:0;border-radius:18px;box-shadow:0 24px 80px #13304c44;padding:25px;max-width:450px;width:calc(100% - 30px)}dialog::backdrop{background:#142d4f77}dialog label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}dialog input{width:100%}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.hint{color:#778ba2;font-size:12px;margin-top:18px}@media(max-width:720px){.wrap{padding:10px}.top{padding:16px}.top h1{font-size:19px}.layout{grid-template-columns:1fr;gap:12px}.side{padding:8px;display:flex;overflow-x:auto;gap:5px}.side h3{display:none}.nav{white-space:nowrap;width:auto;font-size:13px;padding:11px}.panel{padding:17px;min-height:400px}.cards{grid-template-columns:1fr}.tile{min-height:88px;padding:14px}.item{flex-wrap:wrap}.item button{margin-left:auto}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">POINTAGE COLLECTIF CGT · SIMULATION</div><h1>Administration nationale</h1></div><span class="pill">Administrateur national</span></header><div class="notice">⚠️ Simulation indépendante : données fictives, modifications locales non enregistrées, aucun effet sur l’application réelle.</div><div class="layout"><nav class="side"><h3>Administration</h3><button class="nav active" data-page="home">⌂ Accueil</button><button class="nav" data-page="network">▦ Divisions et unités</button><button class="nav" data-page="national">≡ Catalogue national</button><button class="nav" data-page="users">♙ Utilisateurs</button><button class="nav" data-page="flash">✉ Messages flash</button><button class="nav" data-page="follow">▤ Suivi et exports</button></nav><main id="main" class="panel"></main></div></div><dialog id="edit"><form method="dialog" id="editForm"><h2 id="editTitle">Modifier un code</h2><label for="code">Code d’activité</label><input id="code" required maxlength="25"><label for="label">Libellé</label><input id="label" required maxlength="160"><p class="hint" id="scope"></p><div class="actions"><button type="button" class="secondary" onclick="document.getElementById('edit').close()">Annuler</button><button type="submit" class="primary">Valider la simulation</button></div></form></dialog><script>
const divisions=[{name:"Division Nord",units:["Unité Lille","Unité Amiens"]},{name:"Division Sud",units:["Unité Marseille","Unité Nice"]},{name:"Division Ouest",units:["Unité Nantes","Unité Rennes"]}];const national=[{code:"001",label:"Activité syndicale"},{code:"002",label:"Réunion"},{code:"003",label:"Formation"},{code:"004",label:"Déplacement"}];const unitCodes={};let page="home",unit="",division="",editing=null;const el=id=>document.getElementById(id);const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function codes(){return unit?(unitCodes[unit]??=national.map(x=>({...x}))):national}function go(p){page=p;document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===p||(p==="unit"&&n.dataset.page==="network")));draw()}document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>go(n.dataset.page));function openUnit(d,u){division=d;unit=u;go("unit")}function editCode(i){editing=i;const c=i===-1?{code:"",label:""}:codes()[i];el("code").value=c.code;el("label").value=c.label;el("editTitle").textContent=i===-1?"Ajouter un code":"Modifier un code";el("scope").textContent=unit?"Périmètre : "+unit+" uniquement":"Périmètre : catalogue national (simulation)";el("edit").showModal()}el("editForm").onsubmit=e=>{e.preventDefault();let list=codes();const code=el("code").value.trim(),label=el("label").value.trim();if(list.some((c,i)=>i!==editing&&c.code===code)){alert("Ce code existe déjà sur ce périmètre.");return}if(editing===-1)list.push({code,label});else list[editing]={code,label};el("edit").close();draw()};function network(){return `<div class="eyebrow">Organisation nationale</div><h2>Divisions et unités</h2><p class="sub">Choisissez une division, puis ouvrez une unité pour accéder à ses codes et aux autres fonctions de gestion.</p><div class="toolbar"><input id="find" placeholder="Rechercher directement une unité…" oninput="filterUnits(this.value)"></div><div id="divisionRows">${divisions.map((d,di)=>`<section class="item" data-search="${safe((d.name+" "+d.units.join(" ")).toLowerCase())}"><div class="grow"><strong>▦ ${safe(d.name)}</strong><small>${d.units.length} unités : ${d.units.map(safe).join(" · ")}</small></div><button class="secondary" onclick="toggleDiv(${di})">Consulter ▾</button></section><div id="div${di}" class="hidden">${d.units.map((u,ui)=>`<div class="item" data-search="${safe(u.toLowerCase())}"><div class="grow"><strong>↳ ${safe(u)}</strong><small>Codes, pointages, utilisateurs et documents</small></div><button class="primary" onclick="openUnit(${JSON.stringify(d.name)},${JSON.stringify(u)})">Ouvrir →</button></div>`).join("")}</div>`).join("")}</div>`}function toggleDiv(i){el("div"+i).classList.toggle("hidden")}function filterUnits(v){v=v.toLowerCase();document.querySelectorAll("#divisionRows [data-search]").forEach(x=>x.classList.toggle("hidden",!x.dataset.search.includes(v)));divisions.forEach((d,i)=>{if(v)el("div"+i).classList.remove("hidden")})}function catalog(){const list=codes();return `<div class="crumb">${unit?`<a href="#" onclick="event.preventDefault();go('network')">Divisions et unités</a> / ${safe(division)} / ${safe(unit)}`:"Administration nationale"}</div><div class="eyebrow">${unit?"Gestion de l’unité":"Administration générale"}</div><h2>${unit?"Catalogue de "+safe(unit):"Catalogue national des codes"}</h2><p class="sub">${unit?"Les modifications portent uniquement sur cette unité. Les autres unités conservent leurs propres libellés.":"Consultez et modifiez les codes de référence. Les catalogues d’unités restent accessibles indépendamment."}</p>${unit?`<div class="toolbar"><button class="secondary" onclick="go('network')">← Revenir aux unités</button><button class="secondary" onclick="alert('Simulation : accès aux autres fonctions de l’unité prévu dans l’application réelle.')">Autres fonctions de l’unité</button></div>`:""}<div class="toolbar"><button class="primary" onclick="editCode(-1)">+ Ajouter un code</button></div><div class="tablewrap"><table><thead><tr><th>Code</th><th>Libellé</th><th>Portée</th><th>Action</th></tr></thead><tbody>${list.map((c,i)=>`<tr><td>${safe(c.code)}</td><td>${safe(c.label)}</td><td><span class="chip">${unit?"Cette unité":"National"}</span></td><td><button class="secondary" onclick="editCode(${i})">Modifier</button></td></tr>`).join("")}</tbody></table></div><p class="hint">Les modifications de cette démonstration ne sont ni sauvegardées ni transmises à Supabase.</p>`}function draw(){let s="";if(page==="home"){unit="";s=`<div class="eyebrow">Tableau de bord</div><h2>Bienvenue dans l’administration nationale</h2><p class="sub">Un point d’entrée unique pour piloter l’application, sans unité « ADMIN » dans un sélecteur.</p><div class="cards"><button class="tile" onclick="go('network')">▦<b>Divisions et unités</b><small>Parcourir les unités, gérer leurs codes et leurs données →</small></button><button class="tile" onclick="go('national')">≡<b>Catalogue national</b><small>Consulter et modifier les codes et les libellés →</small></button><button class="tile" onclick="go('users')">♙<b>Utilisateurs</b><small>Accès aux comptes et aux responsables →</small></button><button class="tile" onclick="go('follow')">▤<b>Suivi et exports</b><small>Consulter les résultats et les extractions →</small></button></div><p class="hint">Les écrans « Utilisateurs », « Messages flash » et « Suivi » sont figurés dans cette simulation ; leurs fonctions réelles ne sont pas reproduites ici.</p>`}else if(page==="network"){unit="";s=network()}else if(page==="national"){unit="";s=catalog()}else if(page==="unit"){s=catalog()}else{s=`<div class="eyebrow">Aperçu de navigation</div><h2>${{users:"Utilisateurs",flash:"Messages flash",follow:"Suivi et exports"}[page]}</h2><p class="sub">Cette rubrique resterait disponible dans la nouvelle ergonomie, avec ses fonctions et autorisations actuelles. Simulation visuelle uniquement.</p><button class="primary" onclick="go('home')">← Retour à l’accueil</button>`}el("main").innerHTML=s}draw();
</script></body></html>
